[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document2md"
version = "0.2.0"
description = "Convert PDF, Office and OpenDocument files to faithful, readable Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oscar J. Pellicer-Valero" }]
dependencies = [
  "python-docx>=1.2",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "docling>=2.43",
  "onnxruntime>=1.18",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
document2md = "document2md.cli:main"

[tool.setuptools]
package-dir = { document2md = "skills/document2md/scripts/document2md" }
packages = ["document2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
